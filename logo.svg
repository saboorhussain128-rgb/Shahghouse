<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 140" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3"/>
      <stop offset="25%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#AA771C"/>
      <stop offset="100%" stop-color="#F5D77F"/>
    </linearGradient>
    <linearGradient id="maroonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A0E17"/>
      <stop offset="50%" stop-color="#2D060B"/>
      <stop offset="100%" stop-color="#190205"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Pill (Optional subtle container) -->
  <rect x="5" y="5" width="490" height="130" rx="16" fill="url(#maroonGrad)" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <rect x="10" y="10" width="480" height="120" rx="12" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.6"/>

  <!-- Left Crest / Yarn Spindle Emblem -->
  <g transform="translate(24, 18)">
    <!-- Outer Shield / Circle -->
    <circle cx="52" cy="52" r="46" fill="#1C0306" stroke="url(#goldGrad)" stroke-width="2"/>
    <circle cx="52" cy="52" r="41" fill="none" stroke="url(#goldGrad)" stroke-width="0.75" stroke-dasharray="2,2"/>
    
    <!-- Royal Crown on top of crest -->
    <path d="M 37 32 L 41 40 L 52 30 L 63 40 L 67 32 L 64 45 L 40 45 Z" fill="url(#goldGrad)"/>
    <circle cx="37" cy="30" r="1.5" fill="#FFF2A3"/>
    <circle cx="52" cy="28" r="2" fill="#FFF2A3"/>
    <circle cx="67" cy="30" r="1.5" fill="#FFF2A3"/>

    <!-- Yarn Cone / Spindle Illustration with Golden Thread Loops -->
    <path d="M 46 76 L 58 76 L 55 49 L 49 49 Z" fill="#2E080D" stroke="url(#goldGrad)" stroke-width="1.2"/>
    <!-- Thread wound rings -->
    <ellipse cx="52" cy="53" rx="4" ry="1.5" fill="none" stroke="url(#goldGrad)" stroke-width="1"/>
    <ellipse cx="52" cy="58" rx="5" ry="1.8" fill="none" stroke="url(#goldGrad)" stroke-width="1"/>
    <ellipse cx="52" cy="63" rx="6" ry="2" fill="none" stroke="url(#goldGrad)" stroke-width="1"/>
    <ellipse cx="52" cy="68" rx="6.5" ry="2.2" fill="none" stroke="url(#goldGrad)" stroke-width="1"/>
    <ellipse cx="52" cy="73" rx="7" ry="2.4" fill="none" stroke="url(#goldGrad)" stroke-width="1"/>

    <!-- Flowing golden thread loop around cone -->
    <path d="M 32 60 C 26 70, 36 84, 52 84 C 68 84, 78 70, 72 60 C 66 50, 40 42, 52 38" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Little stars -->
    <polygon points="52,14 53.5,18 57,18 54,20.5 55,24 52,22 49,24 50,20.5 47,18 50.5,18" fill="url(#goldGrad)"/>
  </g>

  <!-- Brand Typography -->
  <!-- "SHAH GHOUSE" Royal Signature Font simulation with Curves -->
  <g transform="translate(142, 22)">
    <!-- Urdu/Arabic Calligraphy Accent / Heritage Motif -->
    <path d="M 10 16 Q 25 10, 45 16 T 85 16" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.6"/>
    <circle cx="95" cy="16" r="2" fill="url(#goldGrad)"/>
    <path d="M 105 16 Q 125 10, 145 16 T 185 16" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.6"/>

    <!-- Main Title -->
    <text x="0" y="52" font-family="'Cinzel', 'Playfair Display', 'Times New Roman', Georgia, serif" font-size="36" font-weight="800" letter-spacing="3" fill="url(#goldGrad)" filter="url(#goldGlow)">
      SHAH GHOUSE
    </text>

    <!-- Subtitle: YARNS & TEXTILES -->
    <text x="3" y="76" font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="8" fill="#FFFFFF">
      PREMIUM YARNS &amp; TEXTILES
    </text>

    <!-- Divider Line with Diamond Center -->
    <line x1="2" y1="86" x2="135" y2="86" stroke="url(#goldGrad)" stroke-width="1"/>
    <polygon points="145,86 150,83 155,86 150,89" fill="url(#goldGrad)"/>
    <line x1="165" y1="86" x2="305" y2="86" stroke="url(#goldGrad)" stroke-width="1"/>

    <!-- Tagline & Heritage -->
    <text x="3" y="99" font-family="'Montserrat', 'Segoe UI', sans-serif" font-size="9.5" font-weight="600" letter-spacing="3.5" fill="#E5C058">
      HYDERABAD • SINCE 1984 • EXPORT QUALITY
    </text>
  </g>
</svg>
